# Local only — Render does NOT read this file.
# Builds the root Dockerfile (NGINX + PHP-FPM + Vite assets).
# Single source of settings: .env (copy .env.example → .env first).
#   - app:   gets every .env line as a real environment variable (env_file)
#   - mysql: ${DB_...} below are filled in from .env by Docker Compose

services:
  app:
    build: .
    ports:
      - "8080:8080"
    # All app settings (DB, APP_URL, PHP_OPCACHE_ENABLE, AUTORUN_*...) live in .env.
    env_file: .env
    volumes:
      # Live code: the container reads your project folder instead of the copy baked into the image.
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  node:
    # Rebuilds Tailwind CSS/JS into public/build every time you save a file.
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Keep node_modules inside Docker (Linux packages), not in your project folder.
      - brainhub_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build -- --watch"

  mysql:
    image: mysql:8.0
    # Same values Laravel uses, so the DB user always matches the app.
    # Note: MySQL only applies these when the volume is created for the first time.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - brainhub_mysql:/var/lib/mysql
    healthcheck:
      # $$ = read the variable inside the container (not at compose time).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  brainhub_mysql:
  brainhub_node_modules:
