# Local only — Render does NOT read this file.
# Builds the root Dockerfile (NGINX + PHP-FPM + Vite assets).
# Compose adds MySQL + env for local smoke tests. No .env file required.

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: BrainHub
      APP_ENV: local
      APP_DEBUG: "true"
      # Local-only key (32 bytes). Not used by Render. Safe to commit for learning.
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: brainhub
      DB_USERNAME: brainhub
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # ── LOCAL DEV MODE (this file is skip-worktree: never committed) ──
      # PHP re-reads edited files on every request (production keeps them in memory).
      PHP_OPCACHE_ENABLE: "0"
      # Skip all Laravel caching on start, so route/config/view changes show immediately.
      # (OPTIMIZE=false alone falls back to per-cache switches, which default to true.)
      AUTORUN_LARAVEL_OPTIMIZE: "false"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      AUTORUN_LARAVEL_EVENT_CACHE: "false"
      # Skip storage:link — www-data can't create the symlink in your mounted folder.
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
    volumes:
      # Live code: the container reads your project folder instead of the copy baked into the image.
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  node:
    # Rebuilds Tailwind CSS/JS into public/build every time you save a file.
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Keep node_modules inside Docker (Linux packages), not in your project folder.
      - brainhub_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build -- --watch"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: brainhub
      MYSQL_USER: brainhub
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - brainhub_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  brainhub_mysql:
  brainhub_node_modules:
